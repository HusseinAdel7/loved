<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>An Invitation... Just For You</title>
  
  <!-- FontAwesome 6 Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Great+Vibes&family=Cairo:wght@400;600;700&family=Amiri:wght@400;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    /* CSS variables */
    :root {
      --primary-color: #ff003c;
      --accent-gold: #c69b22;
      --bg-dark: #fff5f7;
      --font-luxury: 'Cormorant Garamond', serif;
      --font-cursive: 'Great Vibes', cursive;
      --font-body: 'Montserrat', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background: radial-gradient(circle at center, #fff2f5 0%, #ffd6e0 100%);
      color: #3d0014;
      font-family: var(--font-body);
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    /* Arabic overrides */
    body.lang-ar {
      font-family: 'Cairo', sans-serif !important;
    }
    body.lang-ar .letter h2, body.lang-ar .letter p, body.lang-ar .instruction {
      font-family: 'Amiri', serif !important;
      letter-spacing: 0px !important;
    }

    /* Ambient Candle Light effect */
    .ambient-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 80%, rgba(255, 0, 60, 0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 1;
    }

    /* Floating stars in background */
    #stars-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Floating entrance language toggle */
    .lang-switcher {
      position: absolute;
      top: 30px;
      right: 30px;
      z-index: 100;
    }

    .btn-lang {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 0, 60, 0.2);
      color: var(--primary-color);
      font-family: var(--font-luxury);
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(255,0,60,0.05);
    }

    .btn-lang:hover {
      background: var(--primary-color);
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 0, 60, 0.4);
      transform: translateY(-2px);
    }

    /* Envelope Box container */
    .envelope-container {
      position: relative;
      width: 380px;
      height: 250px;
      z-index: 5;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      animation: float-slow 4s infinite ease-in-out;
    }

    .envelope-container:hover {
      transform: translateY(-10px) rotateX(10deg);
    }

    /* Outer Envelope styling - Crimson Velvet Red */
    .envelope {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #800e26;
      border: 1px solid rgba(198, 155, 34, 0.25);
      box-shadow: 0 20px 45px rgba(255, 0, 60, 0.15), 0 10px 20px rgba(0,0,0,0.1);
      border-radius: 6px;
      transform-style: preserve-3d;
    }

    /* Back Flap structure - Crimson Shades */
    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 125px 190px 125px 0;
      border-color: transparent transparent transparent #991232;
      z-index: 2;
    }

    .envelope::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 125px 0 125px 190px;
      border-color: transparent #991232 transparent transparent;
      z-index: 2;
    }

    /* Bottom fold */
    .envelope-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 190px 130px 190px;
      border-color: transparent transparent #66091d transparent;
      z-index: 3;
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 6px;
    }

    /* Top flap opening */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 130px 190px 0 190px;
      border-color: #a8193a transparent transparent transparent;
      z-index: 4;
      transform-origin: top;
      transition: transform 0.6s ease;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
    }

    /* Gold seal button at the middle */
    .wax-seal {
      position: absolute;
      top: 120px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, #f3d078 0%, #b89324 100%);
      border-radius: 50%;
      z-index: 6;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4), inset 0 2px 5px rgba(255,255,255,0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #634500;
      font-size: 1.6rem;
      border: 2px solid #7c5c00;
      transition: var(--font-body);
      animation: heartbeat 1.5s infinite ease-in-out;
    }

    .wax-seal:hover {
      box-shadow: 0 0 25px var(--accent-gold);
      color: #3b2800;
      transform: translate(-50%, -50%) scale(1.05);
    }

    /* Inner Love Letter page */
    .letter {
      position: absolute;
      bottom: 10px;
      left: 5%;
      width: 90%;
      height: 200px;
      background: #fbf6ec;
      border-radius: 4px;
      z-index: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), z-index 0s 0.3s;
    }

    .letter h2 {
      font-family: var(--font-cursive);
      font-size: 2.2rem;
      color: var(--primary-color);
      margin-bottom: 5px;
    }

    .letter p {
      font-family: var(--font-luxury);
      font-size: 0.95rem;
      color: #3d0014; /* Deep Burgundy for high readability */
      text-align: center;
      font-style: italic;
      letter-spacing: 0.5px;
    }

    /* Interactive state: Opening */
    .envelope-container.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 0;
    }

    .envelope-container.open .letter {
      transform: translateY(-160px);
      z-index: 5;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    }

    .envelope-container.open .wax-seal {
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, -50%) scale(0);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    /* Instruction text */
    .instruction {
      position: absolute;
      bottom: 8vh;
      font-family: var(--font-luxury);
      font-size: 1.4rem;
      font-style: italic;
      letter-spacing: 2px;
      color: var(--primary-color);
      text-shadow: 0 0 10px rgba(255, 0, 60, 0.3);
      z-index: 5;
      animation: pulse-glow 2s infinite ease-in-out;
      pointer-events: none;
      text-align: center;
      padding: 0 20px;
    }

    /* Screen Fade Out Overlay */
    .fade-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .fade-overlay.active {
      opacity: 1;
    }

    /* Core animations */
    @keyframes float-slow {
      0%, 100% { transform: translateY(0) rotateX(0deg); }
      50% { transform: translateY(-12px) rotateX(4deg); }
    }

    @keyframes heartbeat {
      0% { transform: translate(-50%, -50%) scale(1); }
      25% { transform: translate(-50%, -50%) scale(1.08); }
      40% { transform: translate(-50%, -50%) scale(1); }
      60% { transform: translate(-50%, -50%) scale(1.1); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>
  <canvas id="stars-bg"></canvas>

  <!-- Bilingual Switcher -->
  <div class="lang-switcher">
    <button class="btn-lang"><i class="fa-solid fa-globe"></i> EN / عربي</button>
  </div>

  <div class="envelope-container" id="romantic-envelope">
    <!-- Letter Inside -->
    <div class="letter">
      <h2 data-translate="ent_lead">My Princess Alaa...</h2>
      <p data-translate="ent_sub">A beautiful world made of love is waiting for you.</p>
    </div>
    
    <!-- Outer Envelope Folders -->
    <div class="envelope">
      <div class="envelope-flap"></div>
      <div class="envelope-bottom"></div>
      <div class="wax-seal" id="open-seal">
        <i class="fa-solid fa-heart"></i>
      </div>
    </div>
  </div>

  <div class="instruction" data-translate="ent_instruction">To My One and Only Alaa... Break the seal to begin</div>

  <div class="fade-overlay" id="screen-fade"></div>

  <!-- Shared Translation data bundle -->
  <script src="./shared/js/translations.js"></script>

  <script>
    // 1. Dynamic Canvas Star field - Glowing golden twinkles
    const canvas = document.getElementById("stars-bg");
    const ctx = canvas.getContext("2d");
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    class Star {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.6 + 0.4;
        this.twinkleSpeed = Math.random() * 0.02 + 0.005;
        this.angle = Math.random() * Math.PI * 2;
        this.color = Math.random() < 0.5 ? "rgba(255, 0, 60," : "rgba(198, 155, 34,"; // Red and Gold stars!
      }
      draw() {
        this.angle += this.twinkleSpeed;
        const opacity = 0.3 + Math.abs(Math.sin(this.angle)) * 0.7;
        ctx.save();
        ctx.fillStyle = `${this.color}${opacity})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#ff003c";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 70; i++) {
      stars.push(new Star());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => s.draw());
      requestAnimationFrame(animate);
    }
    animate();

    // 2. Interactive Translation Engine inside entrance
    let activeLang = localStorage.getItem("romantic_language") || "en";
    
    function applyEntranceLanguage(lang) {
      document.documentElement.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
      document.documentElement.setAttribute("lang", lang);
      
      if (lang === "ar") {
        document.body.classList.add("lang-ar");
      } else {
        document.body.classList.remove("lang-ar");
      }

      const translatables = document.querySelectorAll("[data-translate]");
      translatables.forEach(el => {
        const key = el.getAttribute("data-translate");
        if (translations[lang][key]) {
          el.innerHTML = translations[lang][key];
        }
      });
    }

    applyEntranceLanguage(activeLang);

    document.querySelector(".btn-lang").addEventListener("click", () => {
      activeLang = activeLang === "en" ? "ar" : "en";
      localStorage.setItem("romantic_language", activeLang);
      applyEntranceLanguage(activeLang);
    });

    // 3. Click to open and transition logic
    const envelope = document.getElementById("romantic-envelope");
    const fadeOverlay = document.getElementById("screen-fade");

    envelope.addEventListener("click", () => {
      if (!envelope.classList.contains("open")) {
        envelope.classList.add("open");
        
        localStorage.setItem("romantic_music_playing", "true");
        localStorage.setItem("romantic_music_time", "0");

        setTimeout(() => {
          fadeOverlay.classList.add("active");
          setTimeout(() => {
            window.location.href = "./index/index.html";
          }, 1100);
        }, 1800);
      }
    });
  </script>
</body>
</html>
